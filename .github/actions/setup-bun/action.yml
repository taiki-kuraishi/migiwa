name: Setup Bun
description: Restore Bun's install cache and install dependencies. Bun must already be on PATH.

runs:
  using: composite
  steps:
    - uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-install-${{ runner.os }}-
    - shell: bash
      run: bun ci
