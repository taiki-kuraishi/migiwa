name: Cache Vite Task results
description: Restore vp run's task cache, saving a fresh entry when the job succeeds. Call after dependencies are installed.

runs:
  using: composite
  steps:
    # 実行ごとの key は hit しないので、post step は必ず保存する。restore-keys が直近の entry を拾い、
    # どこまでがまだ有効かは Vite Task が task ごとに判断する。
    - uses: actions/cache@v6
      with:
        path: node_modules/.vite/task-cache
        key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: vite-task-${{ runner.os }}-${{ runner.arch }}-
