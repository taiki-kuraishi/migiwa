name: ci
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: "bun node"
      # mise は mise.lock の entry が mise.toml を満たさなくなると mise.lock を書き換える。diff が
      # 無いことが、lockfile が toolchain を固定していて実行ごとに解決し直していない証拠になる。
      - run: git diff --exit-code -- mise.lock
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/cache-vp-tasks
      - run: bun dedupe --check
      - run: bunx vp run fmt-check
      - run: bunx vp run lint --format=github
      - run: bunx vp run -r type-check
      - run: bunx vp run -r test

  # knip が使う oxc-parser は数 GB の ArrayBuffer を先に確保し、ubuntu-slim の memory では
  # 確保できない（"RangeError: Array buffer allocation failed"）。
  knip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: "bun node"
      - uses: ./.github/actions/setup-bun
      - run: bunx vp run knip
