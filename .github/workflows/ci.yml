name: ci
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Narrowed from the repository default: every job here only reads the checked-out code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-slim
    # 25 minutes, not the previous 10: ttsc compiles typia's plugin from Go source on its
    # first invocation per cache key (cf-typegen --check below is that first invocation).
    # A prior run timed out at 10 minutes with the cold build still unfinished after 9; a
    # local cold-cache repro (empty node_modules/.cache/ttsc, empty GOMODCACHE, network Go
    # module download included) took ~3 minutes on faster hardware, so this ceiling leaves
    # real headroom for a slower runner rather than the ~1-2x margin the old number gave.
    # This headroom matters beyond just letting the job pass once: a killed job skips every
    # step's Post phase, including cache-ttsc's save, so a timeout here doesn't just fail the
    # run — it also means the compiled plugin is never cached and every future run repeats
    # the same cold build and times out again. Do not trim this back without first confirming
    # node_modules/.cache/ttsc actually restores warm (see .github/actions/cache-ttsc).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      # Composites are called from the job, never from inside another composite:
      # setup-mise installs bun, setup-bun caches + installs deps.
      - uses: ./.github/actions/setup-mise
        with:
          install_args: "bun"
      # mise rewrites mise.lock in place whenever the committed entries no longer
      # satisfy the install (a bumped mise.toml, a platform it has to resolve
      # itself). A clean diff here is the proof the lockfile is actually pinning
      # the toolchain instead of being regenerated from the network every run.
      - run: git diff --exit-code -- mise.lock
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/cache-vp-tasks
      # ttsc installs a ~185 MB bundled Go toolchain and compiles typia's plugin from Go
      # source on first use (cf-typegen --check below runs the pre-build, which is the first
      # ttsc invocation in this job). Neither directory is covered by setup-bun's or
      # cache-vp-tasks' caches, and every run repeats the multi-minute cold build without this.
      - uses: ./.github/actions/cache-ttsc
      - run: bun dedupe --check
      # Diffs a content hash regenerated in memory against the file's own header (env types plus
      # a runtime header for the workerd version, compatibility_date and compatibility_flags), so
      # a wrangler bump alone, with wrangler.jsonc untouched, can fail this check too.
      - run: bun run --cwd apps/bot cf-typegen --check
      # The test runner and wrangler implement the .sql Text rule in different bundlers, so a
      # green vitest run does not prove the deploy bundle builds. --dry-run makes no API calls
      # and needs no token or account id. Workers Builds does the real deploy (spec §11).
      - run: bun run --cwd apps/bot wrangler deploy --dry-run --outdir "$RUNNER_TEMP/bot-dist"
      - run: bunx vp run oxlint --deny-warnings --format=github
      - run: bunx vp run oxfmt --check
      - run: bunx vp run type-check
      - run: bunx vp run -r type-check
      - run: bunx vp run -r test

  # knip runs on ubuntu-latest, not ubuntu-slim: it parses with oxc-parser, which
  # pre-allocates a fixed multi-GB ArrayBuffer that fails on ubuntu-slim's ~4.9 GB
  # ("RangeError: Array buffer allocation failed"). oxlint/oxfmt above are native
  # binaries and do not hit this, so only knip needs the larger runner.
  knip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mise
        with:
          install_args: "bun"
      - uses: ./.github/actions/setup-bun
      - run: bun run knip
