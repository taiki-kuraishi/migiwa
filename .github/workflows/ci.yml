name: ci
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Composites are called from the job, never from inside another composite:
      # setup-mise installs bun, setup-bun caches + installs deps.
      - uses: ./.github/actions/setup-mise
        with:
          install_args: "bun"
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/cache-vp-tasks
      - run: bun run check:duplicate-versions
      - run: bun run oxlint --deny-warnings --format=github
      - run: bun run oxfmt --check
      - run: bun run type-check
      - run: bunx vp run -r type-check
      - run: bun run knip
      - run: bunx vp run -r test
