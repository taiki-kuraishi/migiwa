name: ci
# paths: で workflow ごと絞らない。skip された workflow は check を報告せず、必須 check が Pending のまま merge を止める。
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      bun: ${{ steps.filter.outputs.bun }}
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - if: github.event_name == 'push'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # oxfmt は md/json/yml も整形するので、bun 側は repo 全体を見る。
          filters: |
            bun:
              - "**"
            terraform:
              - "infra/**"
              - "mise.toml"
              - "mise.lock"
              - ".github/workflows/ci.yml"

  bun:
    needs: changes
    if: needs.changes.outputs.bun == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: "bun node"
      # mise は mise.lock の entry が mise.toml を満たさなくなると mise.lock を書き換える。diff が
      # 無いことが、lockfile が toolchain を固定していて実行ごとに解決し直していない証拠になる。
      - run: git diff --exit-code -- mise.lock
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/cache-vp-tasks
      - run: bun dedupe --check
      - run: bunx vp run fmt-check
      - run: bunx vp run lint --format=github
      # worker-configuration.d.ts は手で直さず cf-typegen で作り直す。diff があれば、wrangler.jsonc か
      # wrangler の版を変えた後の作り直しが commit に入っていない。
      - run: bunx vp run -r cf-typegen
      - run: git diff --exit-code -- 'apps/*/worker-configuration.d.ts'
      # migration は schema を変えた後に drizzle-kit generate で作る。差分か新しい file があれば、その
      # migration が commit に入っていない。
      - run: bunx vp run --filter @migiwa/db generate
      - run: |
          git diff --exit-code -- packages/db/drizzle
          test -z "$(git ls-files --others --exclude-standard -- packages/db/drizzle)"
      - run: bunx vp run -r type-check
      - run: bunx vp run -r test

  # knip が使う oxc-parser は数 GB の ArrayBuffer を先に確保し、ubuntu-slim の memory では
  # 確保できない（"RangeError: Array buffer allocation failed"）。
  knip:
    needs: changes
    if: needs.changes.outputs.bun == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: "bun node"
      - uses: ./.github/actions/setup-bun
      - run: bunx vp run knip

  terraform:
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        stack:
          - aws
          - cloudflare
    defaults:
      run:
        working-directory: infra/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: terraform
      - run: terraform fmt -check -recursive -diff
      # backend の認証を持たないので state には触れず、provider は .terraform.lock.hcl の hash で固定する。
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate

  check:
    needs:
      - changes
      - bun
      - knip
      - terraform
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - if: needs.changes.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
