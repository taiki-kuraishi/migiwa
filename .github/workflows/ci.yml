name: ci
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: bun
      # mise rewrites mise.lock whenever its entries no longer satisfy mise.toml, so a clean
      # diff is the proof the lockfile pins the toolchain rather than being re-resolved per run.
      - run: git diff --exit-code -- mise.lock
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/cache-vp-tasks
      - run: bun dedupe --check
      - run: bunx vp run fmt-check
      - run: bunx vp run lint --format=github
      - run: bunx vp run -r type-check

  # Knip parses with oxc-parser, which pre-allocates a multi-GB ArrayBuffer that ubuntu-slim's
  # memory cannot back ("RangeError: Array buffer allocation failed").
  knip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: bun
      - uses: ./.github/actions/setup-bun
      - run: bunx vp run knip
