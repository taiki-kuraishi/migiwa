name: drizzle-ci
on:
  push:
    branches:
      - main
    paths:
      - "packages/db/**"
      - "bun.lock"
      - ".github/workflows/drizzle-ci.yml"
      - ".github/actions/**"
  pull_request:
    paths:
      - "packages/db/**"
      - "bun.lock"
      - ".github/workflows/drizzle-ci.yml"
      - ".github/actions/**"
  workflow_dispatch:

# Narrowed from the repository default: every job here only reads the checked-out code. This
# file is the template the other `*-ci` workflows get copied from, so keep the scope tight here.
permissions:
  contents: read

concurrency:
  group: drizzle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Proves the committed .sql actually applies. A Durable Object is unreachable from CI, so
  # drizzle.config.sqlite.ts replays the same migration folder against an in-memory SQLite;
  # apps/bot's vitest is what runs migrate() on real workerd.
  migrate:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mise
        with:
          install_args: "bun"
      - uses: ./.github/actions/setup-bun
      - run: bun run --cwd packages/db test:migration

  # Catches a schema change nobody regenerated: migrations are generated by hand, deliberately
  # outside the pre-commit hook (spec §6.6).
  drizzle-drift:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mise
        with:
          install_args: "bun"
      - uses: ./.github/actions/setup-bun
      - run: bun run --cwd packages/db generate:migration
      # `git add -N` makes a freshly generated (untracked) migration show up in the diff.
      # Scoped to the generator's own output: a whole-tree diff also catches whatever the
      # setup steps touch, which says nothing about drift.
      - run: git add -N packages/db/drizzle && git diff --exit-code -- packages/db/drizzle
