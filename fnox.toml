#:schema https://fnox.jdx.dev/schema.json

# secret は作者の個人 AWS account にあるので、fnox は AWS_PROFILE の上でその account の role を assume する。
# self-host する人は fnox.local.toml で [providers.aws] を定義し直す。fnox はこのファイルの後に
# fnox.local.toml を読む。
[providers.aws]
type = "aws-sm"
region = "ap-northeast-1"
role_arn = "arn:aws:iam::297580067274:role/OrganizationAccountAccessRole"

[secrets]
CLOUDFLARE_API_TOKEN = { provider = "aws", value = "MIGIWA_CLOUDFLARE_API_TOKEN", if_missing = "error" }
# bucket ができてからでないと発行できない。warn なので、最初の -target apply はこれらが無くても走る。
# 値が無ければ、sink の precondition と maintenance.sh で止まる。
TF_VAR_sink_token = { provider = "aws", value = "MIGIWA_CLOUDFLARE_SINK_TOKEN", if_missing = "warn" }
CLOUDFLARE_MAINTENANCE_TOKEN = { provider = "aws", value = "MIGIWA_CLOUDFLARE_MAINTENANCE_TOKEN", if_missing = "warn" }
# warn なので、値を入れる前でもほかの用途の `fnox exec` は走る。無ければ infra/cloudflare の plan が止まる。
TF_VAR_discord_bot_token = { provider = "aws", value = "MIGIWA_DISCORD_BOT_TOKEN", if_missing = "warn" }
# packages/db の migrate が使う。warn なので、値を入れる前でもほかの用途の `fnox exec` は走る。
TURSO_AUTH_TOKEN = { provider = "aws", value = "MIGIWA_TURSO_AUTH_TOKEN", if_missing = "warn" }
# 作者の DB の URL で、秘密ではない。self-host する人は fnox.local.toml で上書きする。
TURSO_DATABASE_URL = { default = "libsql://migiwa-aggregates-taiki-kuraishi.aws-ap-northeast-1.turso.io" }
# 作者の account の ID。self-host する人は fnox.local.toml で上書きする。
TF_VAR_account_id = { default = "bd1a33a9922e50b3afff5a2f21ad52d0" }
CLOUDFLARE_ACCOUNT_ID = { default = "bd1a33a9922e50b3afff5a2f21ad52d0" }
