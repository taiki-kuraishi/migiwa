#:schema https://fnox.jdx.dev/schema.json

# The secrets live in the author's personal AWS account, so fnox assumes a role there on top of
# AWS_PROFILE. Self-hosters redefine [providers.aws] in fnox.local.toml, which fnox loads after
# this file.
[providers.aws]
type = "aws-sm"
region = "ap-northeast-1"
role_arn = "arn:aws:iam::297580067274:role/OrganizationAccountAccessRole"

[secrets]
CLOUDFLARE_API_TOKEN = { provider = "aws", value = "MIGIWA_CLOUDFLARE_API_TOKEN", if_missing = "error" }
# Issued only after the bucket exists; warn lets the first -target apply run without them.
# The sink precondition and maintenance.sh still stop on a missing value.
TF_VAR_sink_token = { provider = "aws", value = "MIGIWA_CLOUDFLARE_SINK_TOKEN", if_missing = "warn" }
CLOUDFLARE_MAINTENANCE_TOKEN = { provider = "aws", value = "MIGIWA_CLOUDFLARE_MAINTENANCE_TOKEN", if_missing = "warn" }
