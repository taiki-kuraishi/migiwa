pre-commit:
  parallel: true
  commands:
    install:
      run: bun install --frozen-lockfile --dry-run
    dedupe:
      run: bun dedupe --check
    fmt:
      stage_fixed: true
      run: bunx vp run fmt
    lint:
      run: bunx vp run lint
    type-check:
      run: bunx vp run -r type-check
    test:
      run: bunx vp run -r test
    knip:
      run: bunx vp run knip
