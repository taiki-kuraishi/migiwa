pre-commit:
  parallel: true
  commands:
    install:
      run: bun install --frozen-lockfile --dry-run
    dedupe:
      run: bun dedupe --check
    fmt:
      stage_fixed: true
      run: bunx vp run fmt
    lint:
      run: bunx vp run lint
    type-check:
      run: bunx vp run -r type-check
    test:
      run: bunx vp run -r test
    knip:
      run: bunx vp run knip
    cf-typegen:
      run: bunx vp run -r cf-typegen && git diff --exit-code -- 'apps/*/worker-configuration.d.ts'
    drizzle-generate:
      run: >-
        bunx vp run --filter @migiwa/db generate &&
        git diff --exit-code -- packages/db/drizzle &&
        test -z "$(git ls-files --others --exclude-standard -- packages/db/drizzle)"
